<!doctype html><html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>Mentor / vakdocent</title>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#F4F2ED;color:#1E1F22}
.bar{display:flex;gap:16px;align-items:center;padding:12px 20px;background:#fff;border-bottom:1px solid #E3DFD8}
.bar a{margin-left:auto;font-size:14px;color:#6B6A66}.wrap{max-width:860px;margin:0 auto;padding:24px}
.kaart{background:#fff;border:1px solid #E3DFD8;border-radius:14px;padding:20px;margin-top:16px}
table{width:100%;border-collapse:collapse}td,th{padding:9px 12px;font-size:14px;text-align:left}
tr+tr td{border-top:1px solid #E3DFD8}.btn{background:#1E1F22;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-weight:600;cursor:pointer}
input{padding:10px;border:1px solid #E3DFD8;border-radius:8px}</style>
</head><body>
<div class="bar"><strong>Unfold Neo — Mentor / vakdocent</strong><span id="wie" style="color:#6B6A66;font-size:14px"></span><a href="/logout">Uitloggen</a></div>
<div class="wrap">
  <div class="kaart"><h2>Klassen</h2>
    <div style="display:flex;gap:10px;margin-bottom:12px">
      <input id="klasnaam" placeholder="Klasnaam (bv. Klas 1)"><button class="btn" onclick="maakKlas()">Klas aanmaken</button>
    </div>
    <div id="klassen"></div>
  </div>
  <div class="kaart"><h2>Recente voortgang</h2><div id="voortgang"></div></div>
</div>
<script src="/shared.js"></script>
<script>
getGebruiker().then(g => { if(g) document.getElementById("wie").textContent = g.naam; });
async function laadKlassen(){
  const r = await fetch("/api/klassen"); const k = await r.json();
  document.getElementById("klassen").innerHTML = k.length
    ? "<table><tr><th>Klas</th><th>Leerlingen</th></tr>" + k.map(x=>`<tr><td>${x.naam}</td><td>${x.leden}</td></tr>`).join("") + "</table>"
    : "<p style='color:#6B6A66'>Nog geen klassen.</p>";
}
async function maakKlas(){
  const naam = document.getElementById("klasnaam").value.trim(); if(!naam) return;
  await fetch("/api/klassen",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"create",naam})});
  document.getElementById("klasnaam").value=""; laadKlassen();
}
async function laadVoortgang(){
  const r = await fetch("/api/voortgang"); const v = await r.json();
  document.getElementById("voortgang").innerHTML = v.length
    ? "<table><tr><th>Leerling</th><th>Challenge</th><th>Niveau</th><th>XP</th></tr>" + v.slice(0,25).map(x=>`<tr><td>${x.leerlingEmail||"—"}</td><td>${x.challenge||"—"}</td><td>${x.niveau||"—"}</td><td>${x.xp}</td></tr>`).join("") + "</table>"
    : "<p style='color:#6B6A66'>Nog geen voortgang.</p>";
}
laadKlassen(); laadVoortgang();
</script>
</body></html>
