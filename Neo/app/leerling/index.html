<!doctype html><html lang="nl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1"><title>NEO — Leerling</title>
<script>window.NEO_ASSET_BASE="/assets/neo/";</script>
<style>body{margin:0;font-family:system-ui,sans-serif;background:#F4F2ED;color:#1E1F22}
.bar{display:flex;gap:16px;align-items:center;padding:12px 20px;background:#fff;border-bottom:1px solid #E3DFD8}
.bar a{margin-left:auto;font-size:14px;color:#6B6A66}</style>
</head><body>
<div class="bar"><strong>Unfold Neo</strong><span id="wie" style="color:#6B6A66;font-size:14px"></span><a href="/logout">Uitloggen</a></div>
<div id="root" style="min-height:calc(100vh - 50px)"></div>

<!-- ▼▼▼ PLAATS HIER JE NEO-APP ▼▼▼
     Kopieer de inhoud van UnfoldNeo-v19.html hierheen (de <script> met de bundel),
     of laad hem als los bestand:
     <script src="/leerling/neo-app.js"></script>
     De app rendert in #root. Voortgang wegschrijven kan met saveVoortgang() hieronder. -->

<script src="/shared.js"></script>
<script>
  getGebruiker().then(g => { if(g) document.getElementById("wie").textContent = g.naam; });
  // Roep dit aan vanuit de NEO-app als een challenge is afgerond:
  window.saveVoortgang = async (data) => {
    await fetch("/api/voortgang", { method:"POST", headers:{ "Content-Type":"application/json" },
      body: JSON.stringify(data) });
  };
</script>
</body></html>
